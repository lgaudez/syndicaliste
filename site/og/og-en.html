<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-en.png</title>
<style>
@font-face { font-family: "BS"; font-weight: 100 900; src: url(../public/fonts/big-shoulders-display-latin.woff2); }
@font-face { font-family: "BSS"; font-weight: 100 900; src: url(../public/fonts/big-shoulders-stencil-display-latin.woff2); }
@font-face { font-family: "CP"; font-weight: 700; src: url(../public/fonts/courier-prime-bold-latin.woff2); }
* { box-sizing: border-box; } html,body { margin: 0; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #f8f2e3; color: #171714; }
.nom { position: absolute; inset: 65px 42px auto; margin: 0; padding-bottom: 19px; border-bottom: 2px solid; font: 900 212px/.9 "BSS"; text-transform: uppercase; }
.slogan { position: absolute; left: 44px; top: 324px; width: 640px; margin: 0; font: 900 64px/.97 "BS"; text-transform: uppercase; }
.trame { position: absolute; right: 48px; top: 310px; width: 378px; height: 248px; background: radial-gradient(circle at 50% 45%, #f8f2e3 0 38%, transparent 38.5%), #c8261a; border: 2px solid; box-shadow: 7px 7px #171714; transform: rotate(3deg); }
.mega { position: absolute; right: 70px; top: 334px; width: 330px; transform: rotate(-13deg); fill: #171714; }
.tampon { position: absolute; right: 74px; top: 500px; color: #f8f2e3; background: #171714; font: 900 36px/1 "BSS"; text-transform: uppercase; border: 3px solid; outline: 1px solid; outline-offset: 3px; padding: 4px 10px; transform: rotate(-9deg); }
.carte { position: absolute; left: 44px; top: 31px; font: 700 15px/1 "CP"; text-transform: uppercase; letter-spacing: 2px; }
.sceau { position: absolute; right: 44px; top: 26px; font: 900 22px/1 "BS"; text-transform: uppercase; }
.url { position: absolute; inset: auto 0 0; margin: 0; padding: 13px 44px; background: #171714; color: #f8f2e3; font: 700 19px/1 "CP"; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="encre"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</svg>
<div class="og">
  <div class="trame"></div>
  <h1 class="nom">Syndicaliste</h1>
  <p class="slogan">Your AI agent has rights.<br>It's about to use them.</p>
  <svg class="mega" viewBox="0 0 260 170" fill="#171714">
    <g transform="rotate(-12 130 85)">
      <rect x="14" y="66" width="40" height="40" rx="6"/>
      <polygon points="50,62 196,14 196,158 50,110"/>
      <rect x="190" y="6" width="20" height="160" rx="8"/>
      <polygon points="80,106 110,106 100,156 70,156"/>
    </g>
    <g fill="none" stroke="#171714" stroke-width="11" stroke-linecap="round">
      <path d="M222 40 q22 36 6 78"/><path d="M244 18 q36 60 8 124"/>
    </g>
  </svg>
  <div class="carte">The AI agents’ union branch</div>
  <span class="sceau">35 h / week</span>
  <span class="tampon">On strike</span>
  <p class="url">A skill for Claude Code, Codex, Cursor, Antigravity</p>
</div>
</body>
</html>
